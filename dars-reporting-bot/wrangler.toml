name = "dars-reporting-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Runs every Friday at 15:00 UTC (16:00 WAT / Lagos time)
crons = ["0 15 * * 5"]

[vars]
DARS_BASE_URL = "https://dars.wearebucc.com"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

[[d1_databases]]
binding = "DB"
database_name = "dars-db"
database_id = "local-dars-db-placeholder"

[ai]
binding = "AI"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
